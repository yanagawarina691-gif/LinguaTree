# Render Blueprint — LinguaTree / ByteCrystal
# One-click deploy: https://render.com/deploy?repo=https://github.com/yanagawarina691-gif/LinguaTree
#
# After deploying, set the environment variables below in the Render dashboard.

services:
  - type: web
    name: linguatree
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_MODE
        value: demo
      - key: PORT
        value: 3000
      - key: HOST
        value: 0.0.0.0
      - key: DEMO_PASSWORD
        sync: false  # 随机口令，至少 24 字符；未设置时拒绝启动
      - key: PUBLIC_ORIGIN
        sync: false  # 对外 HTTPS 来源（例如 https://your-demo.onrender.com），无路径
      # Read-only demo needs no AI keys, media storage or database disk.
      # For a private personal instance, explicitly opt in using README.md.
